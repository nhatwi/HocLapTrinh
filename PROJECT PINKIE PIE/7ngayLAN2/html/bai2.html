	<h1 align = "center">CÔ HÁI MƠ</h1>
	<p><pre>
	Thơ thẩn đường chiểu một khách thơ,
	Say nhìn xa rặng núi xanh lơ,
	Thấp thoáng rừng mơ,<b> Cô hái mơ.</b>
	<u>Tác giả:</u><strike> <i>Vô danh</i></strike>
	</pre></p>
