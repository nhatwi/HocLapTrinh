<!DOCTYPE html>
<html>
<head>
	<meta charset ="utf-8">
	<meta name ="viewport" content ="width=device-width, initial-scale=1.0">
	<title>Sài FillText</title>
</head>
<body>
<canvas id ="mycanvas" width ="300" height ="500" style ="border:1px solid #000000;"></canvas>
<script>
const canvas = document.getElementById("mycanvas")
const context  = canvas.getContext("2d")
context.font ="30px Arial";
context.fillStyle ="red";
context.fillText("Xin chào canvas", 50, 60);
</script>
</body>
</html>
