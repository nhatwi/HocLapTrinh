<!DOCTYPE html>
<html>
<head>
	<meta charset ="utf-8">
	<meta name="viewpoint" content="width=width-device, initial-scale=1.0">
	<title> Sài datalist</title>
</head>
<body>
<form>
	<input list="datalist" name="datalist">
		<datalist id="datalist">
			<option value="Cầu lông">
			<option value="Bóng đá">
			<option value="Cờ vua">
		</datalist>
	<input type="submit" value="Chọn">
</form>
</body>
</html>
