<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pinkie Pie & Mane 6 Y2K Party Live Wallpaper</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/cm-pinkie.png">
</head>
<body>
  <!-- Custom Y2K Pixel Cursor -->
  <div id="retro-cursor" class="retro-cursor" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="26" height="26">
      <path d="M2 2 L2 21 L7 16 L12 23 L15 21 L10 14 L17 14 Z" 
            fill="#FFFFFF" 
            stroke="#1B1425" 
            stroke-width="1.8" 
            stroke-linejoin="miter" 
            stroke-linecap="square"/>
    </svg>
  </div>

  <!-- Sparkle Particle Container -->
  <div id="sparkle-container" class="sparkle-container" aria-hidden="true"></div>

  <!-- Click Ripple Effect Layer -->
  <div id="ripple-container" class="ripple-container" aria-hidden="true"></div>

  <!-- Mane 6 Fullscreen Signature Effects Layer -->
  <div id="signature-effects-container" class="signature-effects-container" aria-hidden="true"></div>

  <!-- LAYER 1: Dynamic Y2K Background -->
  <div class="background-scene" id="bg-scene">
    <!-- Drifting Y2K Starfield Background -->
    <canvas id="starfield-canvas" class="starfield-canvas"></canvas>

    <!-- Gently Curved / Wavy Pastel-Pink Argyle Ribbon -->
    <div class="ribbon-band-wrapper" id="ribbon-wrapper">
      <div class="ribbon-band-track" id="ribbon-track">
        <!-- Repeating Argyle Wave Segments for Seamless Infinite Loop -->
        <div class="argyle-wave-segment"></div>
        <div class="argyle-wave-segment"></div>
        <div class="argyle-wave-segment"></div>
      </div>
    </div>
  </div>

  <!-- LAYER 2 & 3: Center Character (Pinkie Pie) & Interactive Sticker Canvas -->
  <main class="main-stage" id="main-stage">
    <div class="pinkie-wrapper" id="pinkie-wrapper">
      <!-- Bobbing / Breathing Anchor -->
      <div class="pinkie-character" id="pinkie-character">
        
        <!-- Character Visuals Container -->
        <div class="pinkie-visual-box" id="pinkie-visual-box">
          <!-- Real PNG Images -->
          <img id="pinkie-idle-img" 
               class="pinkie-img pinkie-idle-state" 
               src="assets/pinkie-idle.png" 
               alt="Pinkie Pie" 
               draggable="false">
          <img id="pinkie-blink-img" 
               class="pinkie-img pinkie-blink-state" 
               src="assets/pinkie-blink.png" 
               alt="Pinkie Pie Happy" 
               draggable="false">

          <!-- Bulletproof Inline SVG Fallback (Hidden by default, shown if images fail) -->
          <div id="pinkie-svg-fallback" class="pinkie-svg-fallback" style="display: none;">
            <svg viewBox="0 0 400 480" width="100%" height="100%" id="fallback-svg-node">
              <defs>
                <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FF5C9D" />
                  <stop offset="50%" stop-color="#EF2B85" />
                  <stop offset="100%" stop-color="#C70068" />
                </linearGradient>
                <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#FFC5DF" />
                  <stop offset="100%" stop-color="#F7A1C8" />
                </linearGradient>
                <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#197096" />
                  <stop offset="40%" stop-color="#4792B3" />
                  <stop offset="100%" stop-color="#8CE0FF" />
                </linearGradient>
              </defs>

              <!-- Back Mane Curls -->
              <g class="svg-back-mane">
                <circle cx="120" cy="180" r="70" fill="url(#maneGrad)" stroke="#A00050" stroke-width="5" />
                <circle cx="280" cy="180" r="70" fill="url(#maneGrad)" stroke="#A00050" stroke-width="5" />
                <circle cx="90" cy="240" r="60" fill="url(#maneGrad)" stroke="#A00050" stroke-width="5" />
                <circle cx="310" cy="240" r="60" fill="url(#maneGrad)" stroke="#A00050" stroke-width="5" />
                <circle cx="200" cy="110" r="75" fill="url(#maneGrad)" stroke="#A00050" stroke-width="5" />
              </g>

              <!-- Neck and Shoulders -->
              <path d="M140 370 Q130 450 110 480 L290 480 Q270 450 260 370 Z" fill="url(#coatGrad)" stroke="#B55B86" stroke-width="5" />

              <!-- Head Base -->
              <ellipse cx="200" cy="290" rx="95" ry="90" fill="url(#coatGrad)" stroke="#B55B86" stroke-width="5" />

              <!-- Ears -->
              <polygon points="120,240 100,160 160,200" fill="url(#coatGrad)" stroke="#B55B86" stroke-width="5" stroke-linejoin="round"/>
              <polygon points="122,230 112,175 150,202" fill="#FFA5CA" />
              <polygon points="280,240 300,160 240,200" fill="url(#coatGrad)" stroke="#B55B86" stroke-width="5" stroke-linejoin="round"/>
              <polygon points="278,230 288,175 250,202" fill="#FFA5CA" />

              <!-- Cute Cheeks Blush -->
              <ellipse cx="145" cy="330" rx="20" ry="12" fill="#FF8CB7" opacity="0.6" />
              <ellipse cx="255" cy="330" rx="20" ry="12" fill="#FF8CB7" opacity="0.6" />

              <!-- Muzzle & Smile -->
              <ellipse cx="200" cy="338" rx="42" ry="28" fill="#FFD0E5" />
              <circle cx="193" cy="328" r="2.5" fill="#B55B86" />
              <circle cx="207" cy="328" r="2.5" fill="#B55B86" />
              <path d="M185 342 Q200 365 215 342" fill="#C4195B" stroke="#8E0A3E" stroke-width="3" stroke-linecap="round"/>
              <path d="M190 348 Q200 360 210 348" fill="#FF82A9" />

              <!-- Normal Open Eyes Group -->
              <g id="svg-normal-eyes">
                <!-- Left Eye -->
                <ellipse cx="160" cy="275" rx="24" ry="34" fill="#FFFFFF" stroke="#B55B86" stroke-width="3" />
                <ellipse cx="164" cy="275" rx="18" ry="26" fill="url(#eyeGrad)" />
                <ellipse cx="166" cy="275" rx="11" ry="17" fill="#0E2333" />
                <circle cx="158" cy="265" r="7" fill="#FFFFFF" />
                <circle cx="171" cy="285" r="3.5" fill="#FFFFFF" />
                <!-- Left Eyelashes -->
                <path d="M140 258 Q155 242 178 248" fill="none" stroke="#2B1422" stroke-width="4.5" stroke-linecap="round" />
                <path d="M138 252 L132 245" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />
                <path d="M148 245 L144 237" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />

                <!-- Right Eye -->
                <ellipse cx="240" cy="275" rx="24" ry="34" fill="#FFFFFF" stroke="#B55B86" stroke-width="3" />
                <ellipse cx="236" cy="275" rx="18" ry="26" fill="url(#eyeGrad)" />
                <ellipse cx="234" cy="275" rx="11" ry="17" fill="#0E2333" />
                <circle cx="230" cy="265" r="7" fill="#FFFFFF" />
                <circle cx="243" cy="285" r="3.5" fill="#FFFFFF" />
                <!-- Right Eyelashes -->
                <path d="M260 258 Q245 242 222 248" fill="none" stroke="#2B1422" stroke-width="4.5" stroke-linecap="round" />
                <path d="M262 252 L268 245" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />
                <path d="M252 245 L256 237" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />
              </g>

              <!-- Happy Closed Eyes Group (> <) -->
              <g id="svg-closed-eyes" style="display: none;">
                <path d="M138 275 Q160 255 182 275" fill="none" stroke="#2B1422" stroke-width="5" stroke-linecap="round" />
                <path d="M138 275 L132 268" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />
                <path d="M148 266 L145 258" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />

                <path d="M218 275 Q240 255 262 275" fill="none" stroke="#2B1422" stroke-width="5" stroke-linecap="round" />
                <path d="M262 275 L268 268" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />
                <path d="M252 266 L255 258" stroke="#2B1422" stroke-width="3.5" stroke-linecap="round" />
              </g>

              <!-- Front Forehead Mane Curls -->
              <g class="svg-front-mane">
                <circle cx="150" cy="180" r="45" fill="url(#maneGrad)" stroke="#A00050" stroke-width="4.5" />
                <circle cx="220" cy="160" r="55" fill="url(#maneGrad)" stroke="#A00050" stroke-width="4.5" />
                <circle cx="260" cy="195" r="40" fill="url(#maneGrad)" stroke="#A00050" stroke-width="4.5" />
                <circle cx="185" cy="210" r="38" fill="url(#maneGrad)" stroke="#A00050" stroke-width="4.5" />
              </g>
            </svg>
          </div>
        </div>

        <!-- Slapped Stickers Pinned to Pinkie's Face (No hover tooltip) -->
        <div class="sticker-surface" id="sticker-surface"></div>

      </div>
    </div>
  </main>

  <!-- LAYER 4: Retro Windows 95/98 Cascade Pop-up Container -->
  <div class="retro-window-overlay" id="window-overlay" aria-live="polite"></div>

  <!-- Big Reset Celebration Particle Burst -->
  <div id="reset-burst-container" class="reset-burst-container" aria-hidden="true"></div>

  <!-- MINIMALIST FLOATING LIVE WALLPAPER CONTROLS -->
  <aside class="wallpaper-controls" id="wallpaper-controls" aria-label="Wallpaper Controls">
    <!-- Mane 6 Party Guest Summon Button -->
    <button id="btn-party-guest" class="ctrl-btn" title="Summon Mane 6 Party Guest & Special Effect" aria-label="Party Guest">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" opacity="0.3"/>
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
    </button>

    <!-- Mute/Unmute SFX Button -->
    <button id="btn-sound-toggle" class="ctrl-btn" title="Toggle Sound FX (Mute/Unmute)" aria-label="Toggle Sound">
      <svg id="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <svg id="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>

    <!-- Manual Reset Button -->
    <button id="btn-manual-reset" class="ctrl-btn" title="Reset Stickers and Windows" aria-label="Reset Wallpaper">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
